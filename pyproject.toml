[project]
name = "ftb-downloader"
version = "0.1.0"
description = "FTB 整合包下载器（PySide6 GUI，界面参考官方 FTB App）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8",
    "requests>=2.32",
]

[project.scripts]
ftb-downloader = "ftb_downloader.app:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftb_downloader"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
